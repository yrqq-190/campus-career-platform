name: PR 结构自检（机器项）

# 只做「结构 / 格式 / 范围」的机械检查，代替不了 Agent 的内容评审。
# 说明见 docs/agent-review.md。

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- pr-structure-check -->'
            const pr = context.payload.pull_request
            const body = pr.body || ''
            const branch = pr.head.ref
            const owner = context.repo.owner
            const repo = context.repo.repo

            const hit = (re) => re.test(body)

            const checks = [
              ['关联 Issue 与 AC', hit(/Issue[:：]\s*#?\d+/) && hit(/AC[:：]|AC-\d/), true],
              ['变更摘要（改了什么 / 为什么改）', hit(/变更摘要|改了什么|变更说明/), true],
              ['AI 使用说明（工具 + 人工修改点）', hit(/AI\s*使用说明|AI\s*三要素/) && hit(/工具|模型/), false],
              ['测试证据（命令 + 结果）', hit(/测试证据|可复现命令/) && hit(/命令|npm|mvn|pytest|示例|输出/), false],
              ['变更范围核对', hit(/变更范围|范围核对|diff --stat/), false],
              ['风险与回滚', hit(/风险|回滚/), false],
              ['评审清单 / 自查', hit(/评审清单|自查/), false],
              ['分支命名 前缀/issue-N', /^(feature|fix|test|docs|spike)\/issue-\d+/.test(branch), true],
            ]

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            })
            const fileLines = files.slice(0, 40).map(f => '| `' + f.filename + '` | ' + f.status + ' | +' + f.additions + ' / -' + f.deletions + ' |')

            const rows = checks.map(c => '| ' + c[0] + ' | ' + (c[1] ? '✅' : '❌') + ' | ' + (c[2] ? '关键项' : '提示项') + ' |')
            const failedKey = checks.filter(c => c[2] && !c[1]).map(c => c[0])

            let text = MARKER + '\n## PR 结构自检（机器项）\n\n'
            text += '> 本检查只核对**描述结构、分支命名与改动文件清单**，不判断代码正确性、不判断 spec 偏差。内容评审仍由 Agent 评审 + 人工裁决完成，见 `docs/agent-review.md`。\n\n'
            text += '| 检查项 | 结果 | 权重 |\n|---|---|---|\n' + rows.join('\n') + '\n\n'
            text += '改动文件：**' + files.length + '** 个\n\n'
            if (files.length) {
              text += '| 文件 | 状态 | 行数 |\n|---|---|---|\n' + fileLines.join('\n') + '\n'
              if (files.length > 40) text += '\n（仅列前 40 个）\n'
            }
            text += '\n'
            text += failedKey.length
              ? '**关键项未通过：' + failedKey.join('、') + '** —— 补齐 PR 描述后该检查会重跑。'
              : '**关键项全部通过。** 提示项不阻塞合并，但 D3 评审记录里要写清缺项原因。'

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            })
            const old = comments.find(c => (c.body || '').includes(MARKER))
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body: text })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: text })
            }

            if (failedKey.length) {
              core.setFailed('PR 结构自检未通过：' + failedKey.join('、'))
            }
