server:
  port: 8080

spring:
  application:
    name: campus-career-platform

  # 默认 profile 不连数据库：本机没有 MySQL，若让 DataSource 自动配置生效，
  # 启动时会因为没有 url 直接失败，全部集成测试也就跑不起来。
  # 连库时用 mysql profile —— application-mysql.yml 会覆盖这份排除清单。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusLanguageDriverAutoConfiguration

  servlet:
    multipart:
      # 与 spec/mvp1-scope.md 的 MAX_RESUME_SIZE 一致：恰好 10MB 放行。
      # 超过时 Spring 在进入 Controller 前抛 MaxUploadSizeExceededException，
      # 由 GlobalExceptionHandler 转成 413 RESUME_TOO_LARGE。
      max-file-size: 10MB
      # 请求总大小要给 multipart 边界留余量，若与 max-file-size 都写 10MB，
      # 一份恰好 10MB 的文件再加上边界开销会被误判超限。
      max-request-size: 12MB

logging:
  level:
    com.campus.career: INFO

career:
  parse:
    # spec FR-4 写死的三组数字，不是可调优参数：超时 30 秒、最多重试 2 次、间隔 1 秒。
    # 最坏耗时 30 × 3 + 1 × 2 = 92 秒，与 NFR-1 一致。
    # 做成配置的唯一目的是让重试逻辑能在毫秒级验完 —— 真跑 92 秒的用例进不了 CI。
    # 要改这三项，先改 spec 的 FR-4，不允许只改这里的值。
    timeout: 30s
    retries: 2
    interval: 1s
